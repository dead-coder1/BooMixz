name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Build APK
        run: |
          rm -rf android www node_modules package-lock.json
          mkdir -p www
          cp index.html www/index.html || cp ./index.html www/index.html
          echo '{"name":"booomixz","type":"module"}' > package.json
          npm i @capacitor/core @capacitor/cli @capacitor/android
          npx cap init BooMixz com.boomixz.app --web-dir=www
          npx cap add android
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Booo-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk